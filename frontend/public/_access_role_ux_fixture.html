<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Role Access fixture</title>
  <link href="assets/color-admin/css/vendor.min.css" rel="stylesheet">
  <link href="assets/color-admin/css/default/app.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/access-phase5.css">
</head>
<body>
<div id="content" class="app-content p-4" style="margin-left:0;background:#f2f3f4;">
  <div class="card card-borderless table-card mb-4">
    <div class="card-header bg-gray-900" data-bs-theme="dark">
      <h4 class="card-header-title text-white mb-0"><i class="fa fa-list me-1"></i> List Roles</h4>
      <div class="card-header-btn"><button class="btn btn-success btn-xs"><i class="fa fa-plus"></i><span class="ms-1">Tambah Data</span></button></div>
    </div>
    <div class="card-body">
      <table class="table table-striped align-middle mb-0">
        <thead><tr><th>No.</th><th>Role ID</th><th>Nama Role</th><th>Role Maps</th><th class="text-center">Aksi</th></tr></thead>
        <tbody>
          <tr>
            <td>1</td>
            <td><span class="badge access-badge access-badge-code">ADMIN_IT</span></td>
            <td class="fw-semibold">Admin IT</td>
            <td><span class="role-maps-text">1,2,3,8,19,20,21</span></td>
            <td class="text-center"><button class="btn btn-warning btn-xs btn-icon"><i class="fa fa-pen-to-square"></i></button></td>
          </tr>
          <tr>
            <td>2</td>
            <td><span class="badge access-badge access-badge-code">REVIEWER_SCORING</span></td>
            <td class="fw-semibold">Reviewer Scoring</td>
            <td><span class="role-maps-text">3,8</span></td>
            <td class="text-center"><button class="btn btn-warning btn-xs btn-icon"><i class="fa fa-pen-to-square"></i></button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card card-borderless role-form-card">
    <div class="card-header bg-gray-900" data-bs-theme="dark">
      <h4 class="card-header-title text-white mb-0"><i class="fa fa-bullhorn me-1"></i> Form Data Role</h4>
    </div>
    <div class="card-body">
      <div class="row g-3 mb-3">
        <div class="col-md-4"><label class="form-label">Role ID *</label><input class="form-control font-monospace" value="ADMIN_IT" readonly></div>
        <div class="col-md-5"><label class="form-label">Nama Role *</label><input class="form-control" value="Admin IT"></div>
        <div class="col-md-3"><label class="form-label">Role Maps</label><input class="form-control font-monospace" value="8,3" readonly></div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0 fw-bold">MODULE</h5>
        <input class="form-control form-control-sm" style="max-width:220px" placeholder="Search:">
      </div>
      <div class="module-perm-panel">
        <div class="module-group-label">Transaksi &amp; Scoring</div>
        <label class="module-perm-row"><span class="module-perm-caption"><span class="module-perm-code">SCORING.SUBMIT</span><span class="module-perm-sep">-</span><span class="module-perm-name">Mengajukan scoring</span></span><input class="form-check-input" type="checkbox" checked></label>
        <label class="module-perm-row"><span class="module-perm-caption"><span class="module-perm-code">SCORING.APPROVE</span><span class="module-perm-sep">-</span><span class="module-perm-name">Memutuskan scoring</span></span><input class="form-check-input" type="checkbox"></label>
        <div class="module-group-label">User &amp; Access</div>
        <label class="module-perm-row"><span class="module-perm-caption"><span class="module-perm-code">ACCESS.ROLES</span><span class="module-perm-sep">-</span><span class="module-perm-name">Mengelola menu Role</span></span><input class="form-check-input" type="checkbox" checked></label>
      </div>
    </div>
  </div>
</div>
</body>
</html>
